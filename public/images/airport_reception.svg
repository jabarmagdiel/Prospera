<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="orangeShirt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>

    <linearGradient id="glassWall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.15)"/>
      <stop offset="100%" stop-color="rgba(14, 165, 233, 0.05)"/>
    </linearGradient>

    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background: Airport Terminal Hall Interior -->
  <rect width="1200" height="800" fill="url(#skyGrad)"/>

  <!-- Glass Curtain Wall Architecture & Beams -->
  <path d="M0,100 L1200,60" stroke="rgba(255,255,255,0.1)" stroke-width="3"/>
  <path d="M0,250 L1200,200" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  <path d="M0,400 L1200,350" stroke="rgba(255,255,255,0.05)" stroke-width="2"/>

  <!-- Vertical Terminal Pillars -->
  <rect x="150" y="0" width="40" height="520" fill="rgba(255,255,255,0.04)"/>
  <rect x="550" y="0" width="50" height="500" fill="rgba(255,255,255,0.05)"/>
  <rect x="980" y="0" width="40" height="520" fill="rgba(255,255,255,0.04)"/>

  <!-- Flight Information Display Board Silhouette (Airport Context) -->
  <rect x="350" y="80" width="500" height="140" rx="12" fill="#090d16" stroke="#334155" stroke-width="3"/>
  <rect x="370" y="100" width="18" height="18" rx="4" fill="#f97316"/>
  <line x1="400" y1="109" x2="820" y2="109" stroke="#94a3b8" stroke-width="4" stroke-dasharray="12,8"/>
  <line x1="370" y1="135" x2="820" y2="135" stroke="#38bdf8" stroke-width="3" stroke-dasharray="8,6"/>
  <line x1="370" y1="160" x2="820" y2="160" stroke="#22c55e" stroke-width="3" stroke-dasharray="15,10"/>
  <line x1="370" y1="185" x2="820" y2="185" stroke="#e2e8f0" stroke-width="3" stroke-dasharray="10,8"/>

  <!-- Polished Airport Floor -->
  <polygon points="0,480 1200,450 1200,800 0,800" fill="url(#floorGrad)"/>
  <line x1="0" y1="480" x2="1200" y2="450" stroke="#f97316" stroke-width="3" opacity="0.6"/>

  <!-- Floor Reflections -->
  <ellipse cx="380" cy="680" rx="180" ry="25" fill="rgba(249, 115, 22, 0.12)" filter="url(#glow)"/>
  <ellipse cx="800" cy="700" rx="220" ry="30" fill="rgba(56, 189, 248, 0.08)" filter="url(#glow)"/>

  <!-- ==================== SCENE CHARACTERS ==================== -->

  <!-- LEFT: PROSPERA ADVISOR IN BRIGHT ORANGE POLO SHIRT WITH LOGO -->
  <g id="advisor" transform="translate(180, 220)">
    <!-- Advisor Shadow -->
    <ellipse cx="140" cy="470" rx="90" ry="18" fill="rgba(0,0,0,0.4)"/>

    <!-- Legs & Trousers -->
    <path d="M105,330 L95,460 L125,460 L135,330 Z" fill="#1e293b"/>
    <path d="M145,330 L155,460 L185,460 L175,330 Z" fill="#0f172a"/>
    <!-- Shoes -->
    <rect x="85" y="455" width="45" height="15" rx="7" fill="#090d16"/>
    <rect x="150" y="455" width="45" height="15" rx="7" fill="#090d16"/>

    <!-- BRIGHT ORANGE POLO SHIRT (POLERA NARANJA) -->
    <path d="M80,140 Q140,120 200,140 L190,330 L90,330 Z" fill="url(#orangeShirt)"/>
    <!-- Polo Collar & Buttons -->
    <polygon points="125,130 140,160 155,130 140,140" fill="#c2410c"/>
    <line x1="140" y1="160" x2="140" y2="210" stroke="#9a3412" stroke-width="3"/>
    <circle cx="140" cy="175" r="3" fill="#fff"/>
    <circle cx="140" cy="195" r="3" fill="#fff"/>

    <!-- Prospera Logo Badge on Chest -->
    <rect x="155" y="165" width="30" height="20" rx="4" fill="#ffffff"/>
    <path d="M162,170 L170,180 L178,170" fill="none" stroke="#ea580c" stroke-width="2"/>
    <circle cx="170" cy="173" r="2" fill="#ea580c"/>

    <!-- Extended Arm Shaking Hands -->
    <path d="M185,160 C230,170 260,195 295,200" stroke="url(#orangeShirt)" stroke-width="32" stroke-linecap="round" fill="none"/>
    <!-- Hand -->
    <path d="M285,190 Q310,195 320,205 Q305,215 285,210 Z" fill="#fbcfe8" opacity="0.9"/>

    <!-- Head & Cap -->
    <circle cx="140" cy="90" r="35" fill="#fbcfe8"/>
    <!-- Hair/Details -->
    <path d="M110,80 Q140,60 170,80" fill="#475569"/>
    <!-- Orange Cap (Gorra Prospera) -->
    <path d="M105,80 Q140,50 175,80 L195,85 L175,92 Q140,75 105,85 Z" fill="#ea580c"/>
    <!-- Cap Visor -->
    <path d="M160,82 Q195,80 215,88 Q185,95 160,87 Z" fill="#c2410c"/>
  </g>

  <!-- CENTER-RIGHT: ARRIVING FAMILY (MOTHER, CHILD & SUITCASES) -->
  <g id="family" transform="translate(560, 210)">
    <!-- Family Shadow -->
    <ellipse cx="220" cy="480" rx="160" ry="22" fill="rgba(0,0,0,0.4)"/>

    <!-- ROLLING SUITCASE 1 (Large Luggage) -->
    <rect x="60" y="320" width="70" height="120" rx="12" fill="#3b82f6" stroke="#1d4ed8" stroke-width="3"/>
    <rect x="72" y="340" width="46" height="80" rx="6" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
    <!-- Luggage Handle -->
    <path d="M85,320 L85,260 L105,260 L105,320" stroke="#64748b" stroke-width="5" fill="none"/>
    <circle cx="75" cy="445" r="8" fill="#0f172a"/>
    <circle cx="115" cy="445" r="8" fill="#0f172a"/>

    <!-- ROLLING SUITCASE 2 (Carry-on) -->
    <rect x="360" y="350" width="55" height="90" rx="10" fill="#e11d48" stroke="#be123c" stroke-width="3"/>
    <path d="M380,350 L380,300 L395,300 L395,350" stroke="#64748b" stroke-width="4" fill="none"/>
    <circle cx="372" cy="443" r="7" fill="#0f172a"/>
    <circle cx="403" cy="443" r="7" fill="#0f172a"/>

    <!-- MOTHER (Arriving Guest) -->
    <g id="mother">
      <!-- Legs -->
      <rect x="180" y="350" width="22" height="120" rx="6" fill="#334155"/>
      <rect x="215" y="350" width="22" height="120" rx="6" fill="#1e293b"/>
      <rect x="175" y="465" width="32" height="12" rx="5" fill="#090d16"/>
      <rect x="210" y="465" width="32" height="12" rx="5" fill="#090d16"/>

      <!-- Jacket / Outfit -->
      <path d="M160,160 Q210,140 260,160 L250,360 L170,360 Z" fill="#0284c7"/>

      <!-- Arm Reaching out to Shake Hands -->
      <path d="M165,180 C110,195 50,210 -45,210" stroke="#0284c7" stroke-width="26" stroke-linecap="round" fill="none"/>
      <!-- Mother's Hand Shaking Advisor's Hand -->
      <path d="-60,200 Q-35,195 -25,210 Q-45,220 -65,215 Z" fill="#fed7aa"/>

      <!-- Mother's Head & Hair -->
      <circle cx="210" cy="110" r="32" fill="#fed7aa"/>
      <!-- Black/Dark Brown Hair -->
      <path d="M175,100 C175,50 245,50 245,100 C245,140 235,150 235,150 L185,150 Z" fill="#1e1b4b"/>
    </g>

    <!-- DAUGHTER (Young Child Holding Mother's Hand) -->
    <g id="daughter" transform="translate(110, 80)">
      <!-- Legs -->
      <rect x="185" y="310" width="14" height="85" fill="#f43f5e"/>
      <rect x="208" y="310" width="14" height="85" fill="#e11d48"/>
      <!-- Dress -->
      <path d="M170,220 Q204,210 238,220 L245,315 L163,315 Z" fill="#fb7185"/>
      <!-- Daughter Head & Pigtails -->
      <circle cx="204" cy="180" r="22" fill="#fed7aa"/>
      <circle cx="180" cy="175" r="10" fill="#1e1b4b"/>
      <circle cx="228" cy="175" r="10" fill="#1e1b4b"/>
    </g>

  </g>

  <!-- Ambient Airport Lighting Sparks -->
  <circle cx="250" cy="120" r="2" fill="#fff" opacity="0.8"/>
  <circle cx="750" cy="90" r="3" fill="#38bdf8" opacity="0.6"/>
  <circle cx="920" cy="140" r="2" fill="#f97316" opacity="0.7"/>

</svg>
